name: Materialise v2.3.0 source

on:
  push:
    paths:
      - '.github/workflows/unpack-v2.2.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract preserved v2.2.0 core
        run: unzip -o generic_local_file_search_v2.2.0.zip -d .

      - name: Integrate v2.3.0 structured LLM search layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('generic_file_search_gui.py')
          s = p.read_text()
          s = s.replace('Version: 2.2.0', 'Version: 2.3.0')
          marker = '\ndef main() -> int:\n'
          patch = '''\n\n# v2.3.0 structured metadata-aware LLM search layer.\n# The application is normal source code after cloning; no ZIP extraction is required.\nfrom v2_3_search_logic import install as _install_v2_3_search_logic\n_install_v2_3_search_logic(sys.modules[__name__])\n'''
          if patch.strip() not in s:
              s = s.replace(marker, patch + marker)
          p.write_text(s)
          Path('requirements.txt').write_text(Path('generic_file_search_requirements.txt').read_text())
          PY

      - name: Syntax check
        run: python3 -m py_compile generic_file_search_gui.py v2_3_search_logic.py

      - name: Commit normal clone-ready source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generic_file_search_gui.py generic_file_search_requirements.txt requirements.txt GENERIC_FILE_SEARCH_README.md
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Materialise clone-ready Generic Local File Search v2.3.0 source"
            git push
          fi
